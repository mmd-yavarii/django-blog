{% load static %}

<link rel="stylesheet" href="{% static 'css/nav.css' %}" />

<nav>
    <ul>
        <li class="logo">MyBlog</li>

        <li>
            <a href="{% url 'blog:ticket' %}">تیکت‌ها</a>
        </li>

        <li>
            <a href="{% url 'blog:posts_list' %}">پست‌ها</a>
        </li>

        {% if request.user.is_authenticated %}
        <li>
            <a href="{% url 'blog:add_post' %}">افزودن پست</a>
        </li>

        <li>
            <a href="{% url 'blog:profile' %}" class="user-avatar">
                <img src="{% static 'avatar.webp' %}" alt="پروفایل" />
            </a>
        </li>
        {% else %}
        <li>
            <a href="{% url 'blog:login' %}" class="login-btn"> ورود / ثبت‌نام </a>
        </li>
        {% endif %}
    </ul>
</nav>
